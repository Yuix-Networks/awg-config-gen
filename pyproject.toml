[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "awg-config-gen"
version = "1.0.0"
description = "Generate and audit AmneziaWG configs, with the obfuscation rules actually enforced."
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [{name = "Yuix Networks", email = "info@yuix.org"}]
keywords = [
    "amneziawg", "awg", "wireguard", "vpn", "dpi", "obfuscation",
    "censorship", "config-generator", "x25519",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet",
    "Topic :: Security :: Cryptography",
    "Topic :: System :: Networking",
]
# One dependency, and it is the one worth having: this tool's job is
# producing private keys, so the X25519 comes from the audited library
# rather than from us.
dependencies = ["cryptography>=3.4"]

[project.urls]
Homepage = "https://github.com/Yuix-Networks/awg-config-gen"
Source = "https://github.com/Yuix-Networks/awg-config-gen"
Issues = "https://github.com/Yuix-Networks/awg-config-gen/issues"
"VPN by the same people" = "https://www.unblockmaster.com/"

[project.scripts]
awg-config-gen = "awg_config_gen.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
license-files = ["LICENSE"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
